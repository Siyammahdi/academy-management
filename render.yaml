# Render Blueprint — An Nahda Academy API + background worker.
# Sync this file from the Render dashboard (Blueprints → Connect repository)
# or apply manually using the same build/start commands and env vars.
#
# Existing resources this blueprint expects in the workspace:
#   - Web service: academy-management
#   - Key Value:   an-nahda-redis
#   - Postgres:    set DATABASE_URL manually (sync: false below)
#
# Secrets (JWT, Resend, payment gateways, DATABASE_URL) must be set in the
# Render dashboard — never commit real values here.

envVarGroups:
  - name: academy-production
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: WEB_URL
        value: https://www.annahda.net
      - key: APP_URL
        value: https://www.annahda.net
      - key: API_URL
        value: https://academy-management-fkl4.onrender.com
      - key: CORS_ORIGINS
        value: https://annahda.net,https://www.annahda.net,https://annahdanet.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SSLCOMMERZ_STORE_ID
        sync: false
      - key: SSLCOMMERZ_STORE_PASSWORD
        sync: false
      - key: PAYSTATION_MERCHANT_ID
        sync: false
      - key: PAYSTATION_PASSWORD
        sync: false

services:
  # ── HTTP API (NestJS) ─────────────────────────────────────────────────────
  - type: web
    name: academy-management
    runtime: node
    rootDir: api
    buildCommand: pnpm install --frozen-lockfile && pnpm db:generate && pnpm build && pnpm exec prisma migrate deploy
    startCommand: pnpm start:prod:all
    healthCheckPath: /api/v1/health
    envVars:
      - fromGroup: academy-production
      - key: REDIS_URL
        fromService:
          name: an-nahda-redis
          type: keyvalue
          property: connectionString

  # ── Background worker (BullMQ — email, billing, penalties) ────────────────
  - type: worker
    name: academy-management-worker
    runtime: node
    rootDir: api
    buildCommand: pnpm install --frozen-lockfile && pnpm db:generate && pnpm build
    startCommand: pnpm start:worker:prod
    envVars:
      - fromGroup: academy-production
      - key: REDIS_URL
        fromService:
          name: an-nahda-redis
          type: keyvalue
          property: connectionString
